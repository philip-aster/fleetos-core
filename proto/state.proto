syntax = "proto3";

package fleetos.state;

import "identity.proto";

// Pushes Service Authorization Graph (SAG) updates to nodes.
service PolicyService {
  rpc WatchSag(WatchRequest) returns (stream SagUpdate);
}

// Pushes workload schedules to agents.
service SchedulerService {
  rpc WatchSchedule(WatchRequest) returns (stream ScheduleUpdate);
}

// Pushes routing tables to routers.
service RouterAssignmentService {
  rpc WatchRoutes(WatchRequest) returns (stream RouteUpdate);
}

// Unified stream for all cluster-wide, non-payload state changes.
service WatchService {
  rpc WatchEvents(WatchRequest) returns (stream WatchEvent);
}

message WatchRequest {
  uint64 last_known_version = 1;
}

message SagUpdate {
  uint64 version = 1; // Matches Raft log index
  repeated SagRule rules = 2;
  // NOTE: revoked_delegation_ids moved to WatchEvent
}

message SagRule {
  string id = 1; // 16-byte hex string
  PeerSelector from = 2;
  PeerSelector to = 3;
  enum Action {
    ALLOW = 0;
    DENY = 1;
  }
  Action action = 4;
}

message PeerSelector {
  string tenant = 1;
  string service_name = 2;
  string role = 3; // Empty if not applicable
  optional uint32 port = 4; // proto3 optional ensures None vs Some(0) survives the wire
}

message ScheduleUpdate {
  uint64 version = 1;
  repeated WorkloadAssignment assignments = 2;
}

message WorkloadAssignment {
  string workload_id = 1;
  string runtime = 2; // "containerd" or "cloud-hypervisor"
  string image = 3;
  string role = 4;
}

message RouteUpdate {
  uint64 version = 1;
  repeated RouteEntry routes = 2;
}

message RouteEntry {
  string destination_svid = 1;
  string destination_role = 2;
  string target_agent_svid = 3; // RouteHint
}

// Unified event stream for cluster state
message WatchEvent {
  oneof event {
    TrustBundleRotation trust_bundle_rotation = 1;
    ClusterMembership cluster_membership = 2;
    SecretRotationNotification secret_rotation = 3;
    RevokedDelegations revoked_delegations = 4; // Moved here from SagUpdate
  }
}

message TrustBundleRotation {
  uint64 version = 1;
  // In production, this might just be a notification to fetch the new bundle via a unary RPC
  // to keep the stream lightweight, or it could inline the roots depending on size.
  repeated bytes roots_der = 2;
}

message ClusterMembership {
  repeated string active_nodes = 1;
  repeated string active_routers = 2;
  repeated string active_gateways = 3;
}

message SecretRotationNotification {
  string spiffe_id = 1;
}

message RevokedDelegations {
  repeated bytes delegation_ids = 1;
}
