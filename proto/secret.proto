syntax = "proto3";

package fleetos.secret;

// Pushes sealed secrets to agents.
service SecretService {
    rpc WatchSecrets(WatchRequest) returns (stream SealedSecret);
}

message WatchRequest {
    string agent_spiffe_id = 1;
}

message SealedSecret {
    string target_spiffe_id = 1;
    uint64 sealed_for_svid_version = 2;
    uint64 sequence = 3; // For replay protection
    bytes ephemeral_pubkey = 4; // 32 bytes (X25519)
    bytes ciphertext = 5;
}
