syntax = "proto3";

package fleetos.v1.secret;

// Service for SPIFFE-authenticated secret retrieval by workloads and agents
service SecretService {
  rpc FetchSecret (FetchSecretRequest) returns (FetchSecretResponse);
}

message FetchSecretRequest {
  string app_id = 1;
  string key = 2;
  string spiffe_id = 3;
}

message FetchSecretResponse {
  bytes encrypted_payload = 1;
  bytes nonce = 2;
}
