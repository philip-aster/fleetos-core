syntax = "proto3";

package fleetos.v1.secret;

// Service for SPIFFE-authenticated secret retrieval by workloads and agents
service SecretService {
  rpc FetchSecret (FetchSecretRequest) returns (FetchSecretResponse);
}

message FetchSecretRequest {
  string tenant_id = 1;        // Multi-tenant boundary
  string app_id = 2;           // Workload / Service identifier
  string key = 3;              // Secret key identifier
  string spiffe_id = 4;        // Attested SPIFFE ID of requester
  uint64 version = 5;          // 0 for latest version, or specific version index
  bytes ephemeral_pubkey = 6;  // Optional: Workload ephemeral ECDH key for envelope encryption
}

message FetchSecretResponse {
  string key = 1;
  uint64 version = 2;          // Active secret version
  bytes encrypted_payload = 3; // Payload encrypted using ChaCha20Poly1305 / AES-GCM
  bytes nonce = 4;             // Cryptographic initialization vector
  string algorithm = 5;        // Cryptographic scheme used for payload (e.g., "CHACHA20_POLY1305")
  uint64 expires_at_unix = 6;  // Expiration timestamp for short-lived dynamic credentials
}
