syntax = "proto3";

package fleetos.v1.state;

// Real-time KV & Event streaming state API backed by OpenRaft + redb
service StateService {
  // Streams real-time state changes matching key_prefix to workers/routers
  rpc Watch (WatchRequest) returns (stream WatchResponse);

  // Point-in-time point or prefix lookup
  rpc Get (GetRequest) returns (GetResponse);

  // Atomic state mutation with revision checks
  rpc Put (PutRequest) returns (PutResponse);

  // Atomic key deletion
  rpc Delete (DeleteRequest) returns (DeleteResponse);
}

enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  EVENT_TYPE_PUT = 1;
  EVENT_TYPE_DELETE = 2;
  EVENT_TYPE_HEARTBEAT = 3; // Keeps gRPC stream alive over dark overlay
}

message KeyValue {
  bytes key = 1;
  bytes value = 2;
  uint64 create_revision = 3;
  uint64 mod_revision = 4;
}

message WatchRequest {
  uint64 start_revision = 1;
  bytes key_prefix = 2;
  string node_id = 3;       // Target node identifier
  string spiffe_id = 4;     // Attested SPIFFE ID of requester
}

message WatchResponse {
  uint64 revision = 1;
  EventType event_type = 2;
  KeyValue kv = 3;
  bool compact_resync_required = 4; // Signals client to invalidate local cache
}

message GetRequest {
  bytes key = 1;
  bytes range_end = 2;      // Optional: If set, fetches keys in range [key, range_end)
  bool prefix = 3;         // Optional: Fetch all keys matching prefix
}

message GetResponse {
  repeated KeyValue kvs = 1;
  uint64 revision = 2;
}

message PutRequest {
  bytes key = 1;
  bytes value = 2;
  uint64 expected_revision = 3; // 0 for unconditional; >0 for CAS verification
}

message PutResponse {
  uint64 revision = 1;
  bool success = 2;         // False if expected_revision mismatch
}

message DeleteRequest {
  bytes key = 1;
  uint64 expected_revision = 2;
}

message DeleteResponse {
  uint64 revision = 1;
  bool success = 2;
}
