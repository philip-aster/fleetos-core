syntax = "proto3";
package fleetos.v1.state;

// Real-time Watch API streaming state changes to Worker Nodes and Routers
service StateService {
  rpc Watch (WatchRequest) returns (stream WatchResponse);
}

message WatchRequest {
  uint64 start_revision = 1;
  bytes key_prefix = 2;
}

enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  EVENT_TYPE_PUT = 1;
  EVENT_TYPE_DELETE = 2;
}

message WatchResponse {
  uint64 revision = 1;
  EventType event_type = 2;
  bytes key = 3;
  bytes value = 4;
}
