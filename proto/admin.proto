syntax = "proto3";
package fleetos;

import "workload.proto";

service AdminService {
  rpc CreateTenant(CreateTenantRequest) returns (CreateTenantResponse);
  rpc SubmitWorkloadSpec(WorkloadSpec) returns (WorkloadSpecAck); // This now resolves correctly
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
  rpc GetClusterStatus(GetClusterStatusRequest) returns (ClusterStatus);
}

message CreateTenantRequest { string tenant_id = 1; }
message CreateTenantResponse { bool success = 1; }
message WorkloadSpecAck { bool accepted = 1; }
message ListNodesRequest {}
message ListNodesResponse { repeated string node_svids = 1; }
message GetClusterStatusRequest {}
message ClusterStatus { uint64 raft_term = 1; uint32 healthy_nodes = 2; }
