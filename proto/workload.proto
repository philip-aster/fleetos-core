syntax = "proto3";

package fleetos.workload;

message WorkloadSpec {
  string tenant_id = 1;
  string workload_id = 2;
  string image = 3;
  // Maps a specific role (e.g., "primary") to the desired number of replicas.
  // The scheduler expands this into individual PodSpecs.
  map<string, uint32> replicas = 4;
  PodSpec pod_spec = 5;
}

message PodSpec {
  string runtime = 1; // "containerd" or "cloud-hypervisor"
  repeated ContainerPort ports = 2;
  ResourceRequirements resources = 3;
  RestartPolicy restart_policy = 4;
  TerminationSpec termination = 5;
  repeated VolumeMount volumes = 6;
  repeated EnvVar env = 7;
  map<string, string> labels = 8;
  ProbeSet probes = 9;

  // Set exclusively by the scheduler during expansion.
  // Callers submitting a WorkloadSpec cannot set these.
  optional uint32 ordinal = 10;
  optional string pod_id = 11;

  // Required for standalone execution. Context from WorkloadSpec
  // is injected here by the scheduler during expansion.
  string tenant_id = 12;
  string workload_id = 13; // Used as the <name> in the SpiffeId URI
  string role = 14;        // Used for the WorkloadRole X.509 extension
  string image = 15;       // The OCI image to pull
}

message ContainerPort {
  uint32 container_port = 1;
  string protocol = 2; // "tcp" or "udp"
}

message ResourceRequirements {
  uint32 vcpus = 1;
  uint32 memory_mb = 2;
  uint32 disk_gb = 3;
}

enum RestartPolicy {
  ALWAYS = 0;
  ON_FAILURE = 1;
  NEVER = 2;
}

message TerminationSpec {
  uint64 grace_period_seconds = 1;
}

message VolumeMount {
  string name = 1;
  string mount_path = 2;
  bool read_only = 3;
}

message EnvVar {
  string name = 1;
  string value = 2;
}

message ProbeSet {
  Probe liveness = 1;
  Probe readiness = 2;
  Probe startup = 3; // Gates when liveness/readiness begin
}

message Probe {
  oneof check {
    ExecCheck exec = 1;
    HttpGetCheck http_get = 2;
    TcpSocketCheck tcp_socket = 3;
  }
  uint32 initial_delay_seconds = 4;
  uint32 period_seconds = 5;
  uint32 timeout_seconds = 6;
  uint32 success_threshold = 7;
  uint32 failure_threshold = 8; // Fixed field collision
}

message ExecCheck {
  repeated string command = 1;
}

message HttpGetCheck {
  string path = 1;
  uint32 port = 2;
}

message TcpSocketCheck {
  uint32 port = 1;
}
