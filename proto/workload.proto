syntax = "proto3";
package fleetos;

message WorkloadSpec {
  string tenant_id = 1;
  string workload_id = 2;
  string image = 3;
  // Maps a specific role (e.g., "primary") to the desired number of replicas.
  // The scheduler expands this into individual PodSpecs.
  map<string, uint32> replicas = 4;
  PodSpec pod_spec = 5;
  PlacementMode placement = 6;
  UpdateStrategy update_strategy = 7;
  AutoscalingPolicy autoscaling = 8;
  map<string, DisruptionBudget> budgets = 9;
}

// Additive: Disruption Budget Value (CR-CTRL-6)
message DisruptionBudgetValue {
  oneof value {
    uint32 count = 1;
    uint32 percent = 2; // 0-100
  }
}

// Additive: Disruption Budget (CR-CTRL-6)
message DisruptionBudget {
  oneof policy {
    DisruptionBudgetValue min_available = 1;
    DisruptionBudgetValue max_unavailable = 2;
  }
}

// ================= CR-CTRL-8 / CR-CORE-9: Autoscaling Policy =================
// Declarative HPA policy. Absent policy = autoscaling disabled (fail-closed).
// Consumed read-only by control's HPA controller, which proposes ScaleWorkload.
message AutoscalingPolicy {
    bool enabled = 1;

    // Per-pod targets. A value of 0 means "do not autoscale on this metric".
    // When enabled == true, at least one target must be > 0.
    uint32 target_cpu_millicores = 2;
    uint64 target_memory_bytes = 6;
    uint64 target_net_rx_bytes_per_sec = 7;
    uint64 target_net_tx_bytes_per_sec = 8;

    uint32 min_replicas = 3;
    uint32 max_replicas = 4;
    uint32 stabilization_window_seconds = 5; // scale-down anti-thrash
}

enum PlacementMode {
  REPLICA_COUNT = 0;
  ONE_PER_NODE = 1;
}

message UpdateStrategy {
  oneof strategy {
    ReplaceStrategy replace = 1;
    RollingReplaceStrategy rolling_replace = 2;
  }
}

message ReplaceStrategy {
  uint32 max_unavailable = 1;
}

message RollingReplaceStrategy {
  uint32 max_surge = 1;
  uint32 max_unavailable = 2;
}

// CR-CORE-10: Init containers
message InitContainer {
  string name = 1;
  string image = 2;
  repeated string command = 3;
  repeated EnvVar env = 4;
  ResourceRequirements resources = 5;
}

// CR-CORE-10: Tolerations (Taints are owned by control's NodeRecord)
message Toleration {
  string key = 1;
  string operator = 2; // "Exists" or "Equal"
  string value = 3;
  string effect = 4; // "NoSchedule", "PreferNoSchedule", "NoExecute"
  int64 toleration_seconds = 5;
}

message PodSpec {
  string runtime = 1; // "containerd" or "cloud-hypervisor"
  repeated ContainerPort ports = 2;
  ResourceRequirements resources = 3;
  RestartPolicy restart_policy = 4;
  TerminationSpec termination = 5;
  // CR-17: renamed from `volumes` (field 6 — wire-compatible, number unchanged).
  // Mount points; each references a Volume source below by name.
  repeated VolumeMount volume_mounts = 6;
  repeated EnvVar env = 7;
  map<string, string> labels = 8;
  ProbeSet probes = 9;
  // Set exclusively by the scheduler during expansion.
  optional uint32 ordinal = 10;
  optional string pod_id = 11;
  // Trusted fields — scheduler-assigned, caller values overwritten.
  string tenant_id = 12;
  string workload_id = 13;
  string role = 14;
  string image = 15;
  // CR-17 (CR-CORE-2): volume sources, referenced by volume_mounts[].name.
  repeated Volume volumes = 16;
  // CR-CORE-10 Additions
  repeated InitContainer init_containers = 17;
  int32 priority = 18;
  repeated Toleration tolerations = 19;
}

message ContainerPort {
  uint32 container_port = 1;
  string protocol = 2; // "tcp" or "udp"
}

message ResourceRequirements {
  uint32 vcpus = 1;
  uint32 memory_mb = 2;
  uint32 disk_gb = 3;
}

enum RestartPolicy {
  ALWAYS = 0;
  ON_FAILURE = 1;
  NEVER = 2;
}

message TerminationSpec {
  uint64 grace_period_seconds = 1;
}

message VolumeMount {
  string name = 1;
  string mount_path = 2;
  bool read_only = 3;
}

// ================= CR-17 (CR-CORE-2): volume sources =================
// A VolumeMount references a Volume by name. Persistent { volume_id, size_gb }
// is DEFERRED — add it additively later with a fresh oneof field number.
message Volume {
  string name = 1; // referenced by VolumeMount.name
  oneof source {
    EmptyDir empty_dir = 2;
    HostPath host_path = 3;
  }
}

message EmptyDir {
  optional uint64 size_limit_bytes = 1;
}

// SECURITY: HostPath is a zero-trust security surface. Default-DENY until an
// explicit SAG/admin policy + security review enables it. Enforcement lives in
// control/agent, not here (this comment is the schema-level annotation).
message HostPath {
  string path = 1;
  HostPathType type = 2;
}

// Conservative subset for a zero-trust overlay; extend additively if needed.
// UNSPECIFIED=0 is deliberate fail-closed: an unset type must not silently
// mean a real type.
enum HostPathType {
  HOST_PATH_TYPE_UNSPECIFIED = 0;
  DIRECTORY_OR_CREATE = 1;
  DIRECTORY = 2;
  FILE = 3;
}

message EnvVar {
  string name = 1;
  string value = 2;
}

message ProbeSet {
  Probe liveness = 1;
  Probe readiness = 2;
  Probe startup = 3;
}

message Probe {
  oneof check {
    ExecCheck exec = 1;
    HttpGetCheck http_get = 2;
    TcpSocketCheck tcp_socket = 3;
  }
  uint32 initial_delay_seconds = 4;
  uint32 period_seconds = 5;
  uint32 timeout_seconds = 6;
  uint32 success_threshold = 7;
  uint32 failure_threshold = 8;
}

message ExecCheck {
  repeated string command = 1;
}

message HttpGetCheck {
  string path = 1;
  uint32 port = 2;
}

message TcpSocketCheck {
  uint32 port = 1;
}

// --- Cron Workloads ---

message CronSchedule {
  string expression = 1; // Standard 5-field cron (e.g., "0 * * * *")
  bool suspend = 2;
}

message CronWorkload {
  string tenant_id = 1;
  string cron_workload_id = 2;
  CronSchedule schedule = 3;
  WorkloadSpec workload_template = 4; // Instantiated on each trigger
}
